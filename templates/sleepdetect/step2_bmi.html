{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-lg p-4">

    <h3 class="mb-4 text-center">BMI Calculator (Metric)</h3>

    <form method="post">
      {% csrf_token %}

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Weight (kg)</label>
          <input type="number" step="0.1" name="weight" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Height (cm)</label>
          <input type="number" step="0.1" name="height" class="form-control" required>
        </div>
      </div>

      <button class="btn btn-dark w-100">
        Calculate BMI
      </button>
    </form>

    {% if show_result %}
    <hr class="my-4">

    <h4 class="text-center">Your BMI</h4>
    <h2 class="text-center text-{{ color }}">{{ bmi }}</h2>
    <p class="text-center fw-bold">{{ status }}</p>

    <!-- BMI TABLE -->
    <table class="table table-bordered text-center mt-4">
      <thead class="table-light">
        <tr>
          <th>BMI</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr class="table-warning">
          <td>&lt; 18.5</td>
          <td>Underweight</td>
        </tr>
        <tr class="table-success">
          <td>18.5 – 24.9</td>
          <td>Healthy Weight</td>
        </tr>
        <tr style="background-color:#ffc107;">
          <td>25.0 – 29.9</td>
          <td>Overweight</td>
        </tr>
        <tr class="table-danger">
          <td>≥ 30.0</td>
          <td>Obese</td>
        </tr>
      </tbody>
    </table>

   <a href="{% url 'step3_activity' %}" class="btn btn-primary w-100 mt-3">
  Continue →
</a>

    {% endif %}

  </div>
</div>

{% endblock %}
