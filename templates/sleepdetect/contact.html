{% extends "base.html" %}
{% block title %}Contact | RestSure AI{% endblock %}

{% block content %}
<h2>Contact</h2>
<p>Email us for support or questions.</p>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" style="max-width: 500px;">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}

<form method="POST" class="card p-3 shadow-sm bg-white" style="max-width: 500px;">
    {% csrf_token %} <input type="text" name="name" class="form-control mb-2" placeholder="Your Name" required>
    
    <input type="email" name="email" class="form-control mb-2" placeholder="Your Email" required>
    
    <textarea name="message" class="form-control mb-3" rows="3" placeholder="Message" required></textarea>
    
    <button type="submit" class="btn btn-dark">Send</button>
</form>
{% endblock %}
